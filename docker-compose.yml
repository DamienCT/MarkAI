# docker-compose.yml — MARKAI base services
#
# Local dev: docker compose up -d          (auto-loads docker-compose.override.yml)
# VPS prod:  docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# Base file has NO host port bindings on internal services.
# Ports are added by override files for each environment.

x-common-env: &common-env
  env_file:
    - .env

services:
  # ── Reverse Proxy (local dev only — VPS overlay disables this) ──
  traefik:
    image: traefik:v3.6
    container_name: markai-traefik
    restart: unless-stopped
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${MARKAI_DOMAIN:-markai.example.com}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$2y$$05$$Y6kz5FZwQvP6OuGqg8dOYeKzGnRjVzEJd8R7K5aIkL9s1dQwXrJOy"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
    networks:
      - markai-net

  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: markai-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-markai}
      POSTGRES_USER: ${POSTGRES_USER:-markai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-markai} -d ${POSTGRES_DB:-markai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - markai-net

  # ── Qdrant (Vector DB) ────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: markai-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - markai-net

  # ── MinIO (Object Storage) ────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: markai-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-markai-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - markai-net

  # ── Valkey (Redis-compatible Cache) ────────────────────────────
  valkey:
    image: valkey/valkey:9.0.3-alpine
    container_name: markai-valkey
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - markai-net

  # ── NATS (Message Broker) ──────────────────────────────────────
  nats:
    image: nats:2.12.5-alpine
    container_name: markai-nats
    restart: unless-stopped
    command: "-js -m 8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - markai-net

  # ── LiteLLM (LLM Gateway) ─────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: markai-litellm
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-markai-litellm-key}
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - markai-net

  # ── n8n (Workflow Automation) ──────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.82.1
    container_name: markai-n8n
    restart: unless-stopped
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      N8N_HOST: n8n.${MARKAI_DOMAIN:-markai.example.com}
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${N8N_WEBHOOK_BASE:-https://n8n.markai.srv1191974.hstgr.cloud/webhook}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      MARKAI_API_URL: http://backend:8000
    networks:
      - markai-net

  # ── Backend (FastAPI) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: markai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARKAI_ENV: ${MARKAI_ENV:-production}
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
      litellm:
        condition: service_started
    networks:
      - markai-net

  # ── Frontend (Next.js) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: markai-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - backend
    networks:
      - markai-net

  # ── Agents (LangGraph Workers) ─────────────────────────────────
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: markai-agents
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m worker' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      nats:
        condition: service_started
      litellm:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - markai-net

  # ── Browser Worker (Playwright) ────────────────────────────────
  browser-worker:
    build:
      context: ./browser-worker
      dockerfile: Dockerfile
    container_name: markai-browser-worker
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - markai-net

  # ── Notifications Service ──────────────────────────────────────
  notifications:
    build:
      context: ./notifications
      dockerfile: Dockerfile
    container_name: markai-notifications
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    networks:
      - markai-net

  # ── Grafana (Dashboards) ───────────────────────────────────────
  grafana:
    image: grafana/grafana:12.4.1
    container_name: markai-grafana
    restart: unless-stopped
    environment:
      GF_PATHS_CONFIG: /etc/grafana/grafana.ini
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - markai-net

  # ── Prometheus (Metrics) ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: markai-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - markai-net

  # ── Loki (Log Aggregation) ────────────────────────────────────
  loki:
    image: grafana/loki:3.6.7
    container_name: markai-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - markai-net

  # ── OpenTelemetry Collector ────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.147.0
    container_name: markai-otel-collector
    restart: unless-stopped
    volumes:
      - ./observability/otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - markai-net

networks:
  markai-net:
    driver: bridge

volumes:
  traefik_certs:
  pgdata:
  qdrant_data:
  minio_data:
  valkey_data:
  nats_data:
  n8n_data:
  grafana_data:
  prometheus_data:
  loki_data:
