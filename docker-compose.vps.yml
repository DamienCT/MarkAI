# docker-compose.vps.yml - Shared VPS production overlay
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# What this does:
#   1. Disables the bundled Traefik (VPS already has one on 80/443)
#   2. No host port bindings anywhere – zero port conflicts
#   3. Connects frontend and backend to the VPS's live external Traefik network
#   4. Adds Docker labels so the VPS Traefik auto-discovers and routes to MARKAI
#   5. Uses the existing VPS n8n instead of deploying a MARKAI-owned n8n container
#   6. Disables observability stack (Grafana/Prometheus/Loki/OTel) – optional, enable with --profile observability
#
# Prerequisites:
#   The VPS Traefik container must already be attached to the external network declared below.

services:
  traefik:
    profiles: ["disabled"]

  backend:
    environment:
      MARKAI_ENV: production
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.markai-api.rule=Host(`api.${MARKAI_DOMAIN}`)"
      - "traefik.http.routers.markai-api.entrypoints=websecure"
      - "traefik.http.routers.markai-api.tls.certresolver=mytlschallenge"
      - "traefik.http.services.markai-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.markai-compress.compress=true"
      - "traefik.http.routers.markai-api.middlewares=markai-compress"
    networks:
      - markai-net
      - n8n_default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${MARKAI_DOMAIN}
        NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.markai-frontend.rule=Host(`${MARKAI_DOMAIN}`)"
      - "traefik.http.routers.markai-frontend.entrypoints=websecure"
      - "traefik.http.routers.markai-frontend.tls.certresolver=mytlschallenge"
      - "traefik.http.services.markai-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.markai-frontend.middlewares=markai-compress"
    networks:
      - markai-net
      - n8n_default

  n8n:
    profiles: ["disabled"]

  # ── Public route to the local GPU forge ─────────────────────────────────
  # The forge itself lives on the operator's 4090 box behind a reverse SSH
  # tunnel bound to the docker bridge (172.17.0.1:9100, host IP — reachable
  # from every bridge network). Traefik's docker provider cannot route to a
  # bare host port, so this one-process socat relay gives the tunnel a
  # container face with routing labels. Auth stays IN the forge (X-API-Key
  # on /v1/*; /health is deliberately open for monitors); the rate limit is
  # a brute-force backstop, sized far above the render pollers.
  # This is what makes the forge reachable from ANY server as
  # https://forge.${MARKAI_DOMAIN} + VIDEO_FORGE_API_KEY — not just from
  # this VPS's tunnel endpoint.
  forge-proxy:
    image: alpine/socat
    container_name: markai-forge-proxy
    restart: unless-stopped
    command: TCP-LISTEN:9100,fork,reuseaddr TCP:172.17.0.1:9100
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.markai-forge.rule=Host(`forge.${MARKAI_DOMAIN}`)"
      - "traefik.http.routers.markai-forge.entrypoints=websecure"
      - "traefik.http.routers.markai-forge.tls.certresolver=mytlschallenge"
      - "traefik.http.services.markai-forge.loadbalancer.server.port=9100"
      - "traefik.http.middlewares.markai-forge-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.markai-forge-ratelimit.ratelimit.burst=60"
      - "traefik.http.routers.markai-forge.middlewares=markai-forge-ratelimit"
    networks:
      - n8n_default

  agents:
    environment:
      MARKAI_ENV: production

  grafana:
    profiles: ["observability"]
  prometheus:
    profiles: ["observability"]
  loki:
    profiles: ["observability"]
  otel-collector:
    profiles: ["observability"]
  promtail:
    profiles: ["observability"]

networks:
  n8n_default:
    external: true
