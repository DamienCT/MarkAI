# docker-compose.vps.yml - Shared VPS production overlay
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# What this does:
#   1. Disables the bundled Traefik (VPS already has one on 80/443)
#   2. No host port bindings anywhere – zero port conflicts
#   3. Connects frontend and backend to the VPS's live external Traefik network
#   4. Adds Docker labels so the VPS Traefik auto-discovers and routes to MARKAI
#   5. Uses the existing VPS n8n instead of deploying a MARKAI-owned n8n container
#   6. Disables observability stack (Grafana/Prometheus/Loki/OTel) – optional, enable with --profile observability
#
# Prerequisites:
#   The VPS Traefik container must already be attached to the external network declared below.

services:
  traefik:
    profiles: ["disabled"]

  backend:
    environment:
      MARKAI_ENV: production
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.markai-api.rule=Host(`api.${MARKAI_DOMAIN}`)"
      - "traefik.http.routers.markai-api.entrypoints=websecure"
      - "traefik.http.routers.markai-api.tls.certresolver=mytlschallenge"
      - "traefik.http.services.markai-api.loadbalancer.server.port=8000"
    networks:
      - markai-net
      - n8n_default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${MARKAI_DOMAIN}
        NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.markai-frontend.rule=Host(`${MARKAI_DOMAIN}`)"
      - "traefik.http.routers.markai-frontend.entrypoints=websecure"
      - "traefik.http.routers.markai-frontend.tls.certresolver=mytlschallenge"
      - "traefik.http.services.markai-frontend.loadbalancer.server.port=3000"
    networks:
      - markai-net
      - n8n_default

  n8n:
    profiles: ["disabled"]

  agents:
    environment:
      MARKAI_ENV: production

  grafana:
    profiles: ["observability"]
  prometheus:
    profiles: ["observability"]
  loki:
    profiles: ["observability"]
  otel-collector:
    profiles: ["observability"]
  promtail:
    profiles: ["observability"]

networks:
  n8n_default:
    external: true
