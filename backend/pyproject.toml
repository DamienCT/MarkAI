[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135,<0.137",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "PyJWT[crypto]>=2.12.0",
    "httpx>=0.28",
    "pyodbc>=5.3",
    "apscheduler>=3.11",
    "nats-py>=2.14",
    "minio>=7.2",
    "qdrant-client>=1.17",
    "litellm>=1.60",
    "redis>=7.1",
    "python-multipart>=0.0.18",
    "google-genai>=1.5",
    "Pillow>=12.0",
    "bcrypt>=4.0",
    "opentelemetry-api>=1.40",
    "opentelemetry-sdk>=1.40",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-exporter-otlp>=1.40",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0",
    "python-json-logger>=3.0",
    "tenacity>=9.0",
    "duckduckgo-search>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "anyio[trio]",
    "httpx",
    "ruff",
]
