[server]
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s/

[security]
admin_user = ${GF_SECURITY_ADMIN_USER:admin}
admin_password = ${GF_SECURITY_ADMIN_PASSWORD:change-me-grafana}
disable_gravatar = true

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/markai-overview.json

[log]
mode = console
level = info

[analytics]
reporting_enabled = false
check_for_updates = false

[unified_alerting]
enabled = true

[feature_toggles]
enable = traceqlEditor tempoSearch tempoBackendSearch
