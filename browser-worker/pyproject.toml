[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markai-browser-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135",
    "uvicorn[standard]",
    "playwright>=1.58",
    "httpx>=0.28",
    "minio>=7.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "beautifulsoup4>=4.14",
    "Pillow>=12.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
