# LiteLLM Proxy Configuration
# Routes all requests through LiteLLM for model management, caching, and observability.
# Swap models here to change providers (OpenAI, Azure, Ollama, etc.) without touching app code.

model_list:
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # Image generation
  - model_name: gpt-image-1.5
    litellm_params:
      model: openai/gpt-image-1.5
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-image-1
    litellm_params:
      model: openai/gpt-image-1
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-image-1-mini
    litellm_params:
      model: openai/gpt-image-1-mini
      api_key: os.environ/OPENAI_API_KEY

  # Video generation
  - model_name: sora-2
    litellm_params:
      model: openai/sora-2
      api_key: os.environ/OPENAI_API_KEY

  - model_name: sora-2-pro
    litellm_params:
      model: openai/sora-2-pro
      api_key: os.environ/OPENAI_API_KEY

  # Gemini models
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # Add on-prem / other providers here, e.g.:
  # - model_name: llama-3
  #   litellm_params:
  #     model: ollama/llama3
  #     api_base: http://ollama:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/VALKEY_HOST
    port: os.environ/VALKEY_PORT
    password: os.environ/VALKEY_PASSWORD
  num_retries: 3
  request_timeout: 120
  set_verbose: false
  drop_params: true
